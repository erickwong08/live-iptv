name: 自动更新IPTV源

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 安装依赖
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: 直接下载现成可用的源并分类
        run: |
          # 下载稳定源
          curl -sSL "https://raw.githubusercontent.com/Guovin/TV/master/iptv/iptv.txt" -o iptv.txt
          
          # 1. IPv4 源（去掉IPv6地址）
          grep -v -E "\[|ipv6" iptv.txt | awk -F ',' '{print "#EXTINF:-1,"$1"\n"$2}' > ipv4.m3u
          sed -i '1i #EXTM3U' ipv4.m3u
          
          # 2. IPv6 源（只保留IPv6地址）
          grep -E "\[|ipv6" iptv.txt | awk -F ',' '{print "#EXTINF:-1,"$1"\n"$2}' > ipv6.m3u
          sed -i '1i #EXTM3U' ipv6.m3u
          
          # 3. 港澳台源
          grep -E "香港|澳门|台湾|TVB|凤凰" iptv.txt | awk -F ',' '{print "#EXTINF:-1,"$1"\n"$2}' > hk_tw.m3u
          sed -i '1i #EXTM3U' hk_tw.m3u
          
          # 4. 全量源
          awk -F ',' '{print "#EXTINF:-1,"$1"\n"$2}' iptv.txt > live.m3u
          sed -i '1i #EXTM3U' live.m3u

      - name: 提交更新
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add *.m3u
          git commit -m "更新IPTV源 $(date +'%Y-%m-%d %H:%M:%S')" || echo "无更新内容"
          git push
