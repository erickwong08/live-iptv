name: 自动更新IPTV源

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 下载现成的直播源
        run: |
          # 直接下载已经处理好的源，不做复杂处理
          curl -sSL "https://raw.githubusercontent.com/Guovin/TV/master/iptv/iptv.m3u" -o live.m3u
          curl -sSL "https://raw.githubusercontent.com/Guovin/TV/master/iptv/iptv.txt" -o iptv.txt

          # 生成IPv4源（只过滤，不做复杂操作）
          grep -v -E "\[|ipv6" iptv.txt | awk -F ',' '{print "#EXTINF:-1,"$1"\n"$2}' > ipv4.m3u
          sed -i '1i #EXTM3U' ipv4.m3u

          # 生成港澳台源
          grep -E "香港|澳门|台湾|TVB" iptv.txt | awk -F ',' '{print "#EXTINF:-1,"$1"\n"$2}' > hk_tw.m3u
          sed -i '1i #EXTM3U' hk_tw.m3u

      - name: 提交更新
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add *.m3u
          git commit -m "更新IPTV源 $(date +'%Y-%m-%d %H:%M:%S')" || echo "无新内容"
          git push
