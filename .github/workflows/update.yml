name: 自动更新IPTV源

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC 0点运行（北京时间8点）
  workflow_dispatch:      # 允许手动运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5  # 修复Node.js警告

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: 赋予脚本执行权限
        run: chmod +x ./iptv.sh

      - name: 运行采集脚本
        run: ./iptv.sh

      - name: 提交更新
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add *.m3u
          git add output/*.m3u 2>/dev/null || true
          git commit -m "自动更新直播源 $(date '+%Y-%m-%d %H:%M:%S')" || echo "无更新内容"
          git push
