name: 自动更新IPTV源

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 安装工具
        run: sudo apt-get update && sudo apt-get install -y curl wget

      - name: 下载稳定直播源（亲测有效）
        run: |
          # 下载一个稳定的公开源
          wget -O iptv.txt https://ghproxy.com/https://raw.githubusercontent.com/Guovin/TV/master/iptv/iptv.txt

          # 生成IPv4源
          echo "#EXTM3U" > ipv4.m3u
          grep -v -E "\[|ipv6" iptv.txt | awk -F ',' '{print "#EXTINF:-1,"$1"\n"$2}' >> ipv4.m3u

          # 生成港澳台源
          echo "#EXTM3U" > hk_tw.m3u
          grep -E "香港|澳门|台湾|TVB|凤凰" iptv.txt | awk -F ',' '{print "#EXTINF:-1,"$1"\n"$2}' >> hk_tw.m3u

          # 生成全量源
          echo "#EXTM3U" > live.m3u
          awk -F ',' '{print "#EXTINF:-1,"$1"\n"$2}' iptv.txt >> live.m3u

      - name: 提交更新
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add *.m3u
          git commit -m "更新IPTV源 $(date +'%Y-%m-%d %H:%M:%S')" || echo "无新内容"
          git push
