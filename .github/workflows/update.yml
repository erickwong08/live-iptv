name: 自动更新IPTV源

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 安装curl
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: 直接下载并生成可用源
        run: |
          # 下载稳定的通用源
          curl -sSL "https://raw.githubusercontent.com/Guovin/TV/master/iptv/iptv.txt" -o iptv.txt

          # 生成IPv4源（只保留非IPv6地址）
          cat > ipv4.m3u <<EOF
#EXTM3U
$(grep -v -E "\[|ipv6" iptv.txt | awk -F ',' '{print "#EXTINF:-1,"$1"\n"$2}')
EOF

          # 生成港澳台源
          cat > hk_tw.m3u <<EOF
#EXTM3U
$(grep -E "香港|澳门|台湾|TVB|凤凰" iptv.txt | awk -F ',' '{print "#EXTINF:-1,"$1"\n"$2}')
EOF

          # 生成全量源
          cat > live.m3u <<EOF
#EXTM3U
$(awk -F ',' '{print "#EXTINF:-1,"$1"\n"$2}' iptv.txt)
EOF

      - name: 提交文件
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add *.m3u
          git commit -m "更新IPTV源 $(date +'%Y-%m-%d %H:%M:%S')" || echo "无新内容"
          git push
